services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devos
      POSTGRES_USER: devos_admin
      POSTGRES_PASSWORD: devos_secure_password
    ports:
      - "5432:5432"
    volumes:
      - devos_pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  redis:
    image: redis:7-alpine
    container_name: devos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devos_redisdata:/data

volumes:
  devos_pgdata:
  devos_redisdata:
